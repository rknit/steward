name = "steward"
# Wraps every command of this project, inside the workspace wrapper.
# {{STEW_STEP}} marks where the command goes. "" means none.
project_wrapper = ""
# Makes the project wrapper usable in a new tree, e.g. "mise trust". Runs once per tree, with consent.
# "" means none.
project_trust = ""

[setup]
run = "go mod tidy"

[build]
run = "go build ./..."
requires = [":setup"]

# New worktrees run this through the post-checkout hook (stew git install post-checkout).
[worktree.setup]
run = ""
requires = [":setup"]

[ci.full]
run = "go test -race ./..."
requires = [":build"]

[ci.quick]
run = "go test ./..."
requires = [":build"]

# The git hooks run these levels.
[ci.pre-commit]
run = ""
requires = [":ci.quick"]

[ci.pre-push]
run = ""
requires = [":ci.full"]
